<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Team Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="login.css" />
</head>
<body>

  <main class="auth-card" role="main">
    <span class="auth-card__eyebrow">Team Nexus</span>
    <h1>Sign in</h1>
    <p class="auth-card__subtitle">Enter your email to access the task board.</p>

    <form id="loginForm" class="auth-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      <p id="errorMsg" class="auth-error hidden">Please enter a valid email address.</p>

      <button type="submit" class="btn-signin">Continue</button>
    </form>
  </main>

  <script src="logn.js"></script>
</body>
</html>
